name: Deploy Frontend

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # STEP DEGLI ECHO PER DEBUG
      - name: Debug Secrets Status
        run: |
          echo "=== DEBUG SECRETS CHECK ==="
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "❌ DOCKER_USERNAME is EMPTY or NOT FOUND"
          else
            echo "✅ DOCKER_USERNAME is PRESENT (Length: ${#DOCKER_USER_LEN})"
          fi

          if [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "❌ DOCKER_PASSWORD is EMPTY or NOT FOUND"
          else
            echo "✅ DOCKER_PASSWORD is PRESENT"
          fi
          echo "==========================="
        env:
          DOCKER_USER_LEN: ${{ secrets.DOCKER_USERNAME }}

      # STEP LOGIN CON ECHO PRIMA DEL COMANDO
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          echo "🔨 Starting Docker build..."
          docker build -t cygnetops/react-test -f Dockerfile.dev .

      - name: Run Tests
        run: |
          echo "🧪 Running containerized tests..."
          docker run -e CI=true cygnetops/react-test npm test
